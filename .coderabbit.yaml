# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Shared on-demand review cadence adopted 2026-09-14; see AGENTS.md.
# Automatic initial/incremental reviews remain disabled. Finish local checks
# and independent review before any substantive manual review request.
# Pane Management remains excluded from the GitHub App installation by the
# user's separate instruction. Do not expand access to test this configuration.
# If access is explicitly authorized later, follow the cadence in AGENTS.md.
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  review_status: false
  auto_review:
    enabled: false
    auto_incremental_review: false
    drafts: false
    base_branches:
      - main
    labels: []
    description_keyword: ""
chat:
  # Preserve this repository's quiet configuration and installation exclusion.
  auto_reply: false
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
    auto_planning:
      enabled: false
      labels: []
  labeling:
    auto_apply_labels: false
