name: Build and checks

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source metadata
        run: |
          bash -n scripts/build-app.sh scripts/build-fixture.sh scripts/build-always-on-preview.sh
          plutil -lint Resources/Info.plist Resources/TestWindowsInfo.plist Resources/AlwaysOnPreviewInfo.plist Resources/local.snapbridge.alwayson.service.plist
          git diff --check
      - name: Build application with supplied artwork
        run: bash scripts/build-app.sh
      - name: Run regression checks
        run: .build/release/SnapCoreChecks
      - name: Run always-on state regression checks
        run: .build/release/AlwaysOnChecks
      - name: Run recovery engine regression checks
        run: .build/release/AlwaysOnEngineChecks
      - name: Run native recovery IO checks
        run: .build/release/AlwaysOnNativeChecks
      - name: Run service coordinator checks
        run: .build/release/AlwaysOnServiceChecks
      - name: Run native daemon boundary checks
        run: .build/release/AlwaysOnDaemonChecks
      - name: Run authenticated client checks
        run: .build/release/AlwaysOnClientChecks
      - name: Run always-on setup checks
        run: .build/release/AlwaysOnSetupChecks
      - name: Package always-on UI preview
        run: bash scripts/build-always-on-preview.sh
      - name: Package disposable test helper
        run: bash scripts/build-fixture.sh
      - name: Verify application bundles
        run: |
          codesign --verify --deep --strict "dist/Always-on Preview.app"
          plutil -lint "dist/Always-on Preview.app/Contents/Info.plist"
          codesign --verify --strict "dist/Pane Management.app/Contents/MacOS/PaneAlwaysOn"
          plutil -lint "dist/Pane Management.app/Contents/Library/LaunchDaemons/local.snapbridge.alwayson.service.plist"
          codesign --verify --deep --strict "dist/Pane Management.app"
          codesign --verify --deep --strict "dist/Pane Management Test Windows.app"
          plutil -lint "dist/Pane Management.app/Contents/Info.plist" "dist/Pane Management Test Windows.app/Contents/Info.plist"
